name: Publish packages

# Versioning and npm publishing for the public packages
# (@modlogtv/halyard-engine, @modlogtv/halyard-cli) with Changesets:
#   - pending changesets on main  -> opens/updates the "Version packages" PR
#   - no pending changesets       -> publishes versions that are not on npm yet
#                                    and creates tags + GitHub releases
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in
# the repository. Each package must be published once interactively (with 2FA)
# and have this workflow registered as trusted publisher on npmjs.com; see
# CONTRIBUTING.md.

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # npm >= 11.5 is required for trusted publishing; Node 24 ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          pr-title: Version packages
          commit-message: Version packages

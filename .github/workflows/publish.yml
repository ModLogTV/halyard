name: Publish packages

# Versioning and npm publishing for the public packages
# (@modlogtv/halyard-engine, @modlogtv/halyard-cli) with Changesets:
#   - pending changesets on main  -> opens/updates the "Version Packages" PR
#   - no pending changesets       -> publishes versions that are not on npm yet,
#                                    tags them and creates GitHub releases
#
# Authentication: npm trusted publishing (OIDC, no secret) once the packages
# exist on npm with this workflow configured as trusted publisher. The very
# first publish of a package needs an NPM_TOKEN repository secret.

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # npm >= 11.5 is required for trusted publishing; Node 24 ships it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Version or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          title: Version packages
          commit: Version packages
          version: bun run version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

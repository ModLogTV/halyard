name: Release

# Smoke-tests the image (starts it against Postgres, checks /healthz, migrations,
# the login page and /metrics), then builds and publishes:
#   - the container image to ghcr.io/modlogtv/halyard  (every push to main, and v* tags)
#   - the Helm chart as an OCI artifact to ghcr.io/modlogtv/charts/halyard  (v* tags only)

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: Smoke test image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: halyard
          POSTGRES_PASSWORD: halyard
          POSTGRES_DB: halyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U halyard -d halyard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build amd64 image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: halyard:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name halyard --network host \
            --read-only --tmpfs /tmp \
            -e DATABASE_URL=postgresql://halyard:halyard@localhost:5432/halyard \
            -e BETTER_AUTH_SECRET=smoke-test-secret-smoke-test-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            halyard:smoke

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::Halyard did not become healthy"
          docker logs halyard
          exit 1

      - name: Check migrations and the UI
        run: |
          set -euo pipefail
          # Migrations ran on startup: the migration journal and a domain table exist.
          docker run --rm --network host postgres:17-alpine \
            psql postgresql://halyard:halyard@localhost:5432/halyard -tAc \
            "select count(*) from drizzle.__drizzle_migrations" | grep -Eq '^[1-9][0-9]*$'
          docker run --rm --network host postgres:17-alpine \
            psql postgresql://halyard:halyard@localhost:5432/halyard -tAc \
            "select to_regclass('public.projects') is not null" | grep -q '^t$'
          # The login page renders.
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/login | grep -q '^200$'
          # Prometheus metrics are served.
          curl -fsS http://localhost:3000/metrics | grep -q '^# '

      - name: Container logs
        if: always()
        run: docker logs halyard

  image:
    name: Build and push image
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # Keep `latest` under our control (tags only).
          flavor: |
            latest=false
          tags: |
            type=sha
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push Helm chart
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to the OCI registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" --password-stdin

      - name: Package chart
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # OCI references must be lowercase.
          IMAGE_REPO="$(echo "${REGISTRY}/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          # Point the chart's default image at the image published by this repo.
          sed -i "s#^  repository: .*#  repository: ${IMAGE_REPO}#" deploy/helm/halyard/values.yaml
          helm lint deploy/helm/halyard \
            --set database.url=postgres://lint --set auth.secret=lintlintlintlintlint
          helm package deploy/helm/halyard \
            --version "${VERSION}" --app-version "${VERSION}" --destination dist
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push chart
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm push "dist/halyard-${{ steps.package.outputs.version }}.tgz" \
            "oci://${REGISTRY}/${OWNER}/charts"

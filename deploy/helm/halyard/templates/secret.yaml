{{- if include "halyard.createSecret" . }}
{{- if not (or .Values.database.url .Values.database.existingSecret) }}
{{- fail "Set database.url, database.existingSecret or existingSecret" }}
{{- end }}
{{- if not .Values.auth.secret }}
{{- fail "Set auth.secret (>= 16 characters) or existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "halyard.fullname" . }}
  labels:
    {{- include "halyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  BETTER_AUTH_SECRET: {{ .Values.auth.secret | quote }}
  {{- with .Values.metrics.token }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
